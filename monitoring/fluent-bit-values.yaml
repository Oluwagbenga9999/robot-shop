config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.loki.svc.cluster.local
        Port 3100
        Label_map_path /fluent-bit/etc/conf/labelmap.json
        Remove_keys kubernetes,stream
        Line_format json
        Labels job=fluent-bit
  extraFiles:
    labelmap.json: |
      {"kubernetes":{"namespace_name":"namespace","pod_name":"pod","container_name":"container","labels":{"service":"service"}}}
