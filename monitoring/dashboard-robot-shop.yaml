apiVersion: v1
kind: ConfigMap
metadata:
  name: robot-shop-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  robot-shop-health.json: |
    {"title":"Robot Shop Health","uid":"robot-shop-health","schemaVersion":39,"version":1,"refresh":"15s","time":{"from":"now-30m","to":"now"},"tags":["robot-shop"],"panels":[{"id":1,"title":"Requests: checks per minute","description":"Synthetic checks sent by the blackbox probe","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":0,"y":0},"fieldConfig":{"defaults":{"unit":"none"},"overrides":[]},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"sum by (instance) (count_over_time(probe_success{job=\"robot-shop-probe\"}[1m]))","legendFormat":"{{instance}}"}]},{"id":2,"title":"Errors: failed checks (%)","description":"Share of checks that failed in the last 5 minutes","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":12,"y":0},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"100 * (1 - avg_over_time(probe_success{job=\"robot-shop-probe\"}[5m]))","legendFormat":"{{instance}}"}]},{"id":3,"title":"Latency: response time","description":"Seconds taken to answer each check","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":0,"y":8},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"probe_duration_seconds{job=\"robot-shop-probe\"}","legendFormat":"{{instance}}"}]},{"id":4,"title":"Availability (%)","description":"Share of checks that succeeded in the last 5 minutes","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":8,"w":12,"x":12,"y":8},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"100 * avg_over_time(probe_success{job=\"robot-shop-probe\"}[5m])","legendFormat":"{{instance}}"}]}]}
